<script>
const lessons={
'Chemical Bonding':[
 {title:'Why atoms bond',say:'Atoms do not bond randomly. They bond because the combined arrangement can be more stable and lower in energy. Think of stability as the main reason, and we will build everything else from that idea.',points:[['Atoms form bonds to become more stable.','Stability is the big idea behind bonding.'],['Valence electrons control most bonding behavior.','The outermost electrons are the ones that usually participate.'],['Lower energy generally means greater stability.','A system tends to move toward arrangements that are energetically favorable.']],visual:'none'},
 {title:'The octet idea',say:'Now look only at the outer shell. For many main-group atoms, a filled valence shell is associated with increased stability. The octet rule is a useful model, but it has important exceptions.',points:[['Many atoms tend toward a stable valence shell.','We use this model to predict common bonding patterns.'],['Eight valence electrons is a useful main-group model.','This is the familiar octet idea.'],['The octet rule is a guide, not an absolute law.','Later, we will meet cases where this simple rule needs modification.']],visual:'octet'},
 {title:'Ionic bonding',say:'Here the key event is electron transfer. One atom can lose electrons while another gains them. The resulting ions have opposite charges, so they attract and form an ionic structure.',points:[['Electron transfer can create ions.','Loss creates a positive ion; gain creates a negative ion.'],['Opposite charges attract.','This electrostatic attraction is central to ionic bonding.'],['Ionic solids form repeating lattices.','The particles arrange into a strong, ordered structure.']],visual:'ionic'},
 {title:'Covalent bonding',say:'Now imagine a different strategy: instead of transferring electrons, atoms share electron pairs. Those shared electrons are attracted to both nuclei, creating a covalent bond.',points:[['Covalent bonds involve shared electron pairs.','Sharing lets both atoms participate in the bonding pair.'],['Shared electrons are attracted to both nuclei.','That attraction helps hold the atoms together.'],['Lewis structures represent shared electrons.','They give us a simple visual language for covalent bonding.']],visual:'covalent'}],
'Photosynthesis':[
 {title:'The big idea',say:'Photosynthesis is the process by which photosynthetic organisms capture light energy and store it as chemical energy. We will separate the process into inputs, energy capture, and carbon fixation.',points:[['Light energy is captured.','Light provides the energy that starts the process.'],['Carbon dioxide and water provide raw materials.','These inputs are transformed through several reactions.'],['Chemical energy is stored in organic molecules.','The captured energy ultimately supports the formation of carbohydrate.']],visual:'photo'},
 {title:'Light-dependent reactions',say:'Light energizes electrons and drives reactions that produce ATP and NADPH. These molecules then carry usable chemical energy into the next stage.',points:[['Light energizes electrons.','Photons provide the energy for electron excitation.'],['ATP and NADPH are produced.','They act as chemical energy and reducing-power carriers.'],['The products feed the next stage.','The energy carriers are then used for carbon fixation.']],visual:'light'},
 {title:'The Calvin cycle',say:'The Calvin cycle uses ATP and NADPH to help incorporate carbon dioxide into organic molecules. The important idea is that carbon is being built into a usable form.',points:[['Carbon dioxide enters the cycle.','This is the carbon source for building organic molecules.'],['ATP supplies energy.','Energy is spent to drive the reactions.'],['NADPH supplies reducing power.','Together, these resources help form carbohydrate precursors.']],visual:'calvin'}]
};
const generic=[
 {title:'Build the idea',say:'Let us start from the simplest possible picture. I will give you the core idea first, then add the details only when they help you understand it.',points:[['Start with the core definition.','First understand what the concept actually means.'],['Connect it to a simple example.','A familiar example makes the abstract idea easier to hold.'],['Then add the deeper mechanism.','Once the foundation is clear, the advanced detail becomes much easier.']],visual:'none'},
 {title:'Make it intuitive',say:'Now I am going to connect the concept to a mental model. Do not memorize the words yet; understand the relationship between the parts.',points:[['Identify the important parts.','Separate the essential pieces from the extra information.'],['Understand how the parts interact.','The relationship is often more important than a definition.'],['Use one test example.','If you can apply the idea, you actually understand it.']],visual:'none'}
];
let state={screen:'home',topic:'',level:'Class 11',depth:'Deep',mins:30,language:'English',voiceName:'auto',languageVoice:'auto',slide:0,point:0,chat:[],listening:false,paused:false,voiceRate:.92,voicePitch:.90,speechToken:0,currentSpeechText:'',currentSpeechAfter:null,aiDeck:null,classLoading:false};window.VYRA_CLASS_STATE=state;const app=document.getElementById('app');
function syncAIChatButton(){
  const tab=document.getElementById('vyraChatTab');
  if(!tab)return;
  // AI Chat is available only before a live class starts.
  tab.style.display=state.screen==='class'?'none':'block';
}
function render(){
  try{
    if(state.screen==='home')home();
    else if(state.screen==='setup'){ setup(); bindSetupChoices(); }
    else classroom();
    syncAIChatButton();
  }catch(err){
    console.error(err);
    state.screen='home';
    home();
    toast('VYRA had a small screen error — try again.');
  }
  if(state.screen==='home'){
    const go=document.getElementById('topicGo');
    const input=document.getElementById('topic');
    if(go) go.onclick=()=>openSetup();
    if(input) input.onkeydown=e=>{if(e.key==='Enter')openSetup()};
  }
}
function home(){app.innerHTML=`<div class="home"><header><div class="brand"><div class="logo">✦</div><b>VYRA</b></div><div class="avatar">R</div></header><main class="hero"><div class="eyebrow">AI-POWERED CLASSROOM</div><h1>What do you want<br><span>to master today?</span></h1><p>VYRA turns your topic into a live, adaptive classroom.</p><div class="composer"><input id="topic" autocomplete="off" placeholder="e.g. Chemical Bonding, calculus, genetics..." value="${escapeHtml(state.topic)}"><button id="topicGo" type="button" aria-label="Start topic">➜</button></div><div class="chips"><button type="button" data-topic="Chemical Bonding">⚗ Chemical Bonding</button><button type="button" data-topic="Photosynthesis">🌿 Photosynthesis</button><button type="button" data-topic="Quadratic Equations">∑ Quadratic Equations</button></div></main><section class="featureGrid"><div class="feature"><b>Adaptive teaching</b><p>Depth follows your level and pace.</p></div><div class="feature"><b>Talk naturally</b><p>Interrupt the class and ask by voice.</p></div><div class="feature"><b>Live chalk notes</b><p>Key points appear on the board as the tutor teaches.</p></div><div class="feature"><b>Teacher-like flow</b><p>Concept → intuition → example → exam connection → quick check.</p></div></section></div>`;
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>pick(b.dataset.topic));
}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pick(x){
  state.topic=x;
  const input=document.getElementById('topic');
  if(input){input.value=x;input.focus();return}
  render();
}
function openSetup(){
  const input=document.getElementById('topic');
  const topic=(input?.value||state.topic||'').trim();
  state.topic=topic||'Chemical Bonding';
  state.screen='setup';
  render();
}
const classLanguages=[
  {id:'English',label:'English',lang:'en-IN',sample:'Hello, today we will learn this topic step by step.'},
  {id:'Hindi',label:'हिन्दी',lang:'hi-IN',sample:'नमस्ते, आज हम इस विषय को आसान तरीके से सीखेंगे।'},
  {id:'Hinglish',label:'Hinglish',lang:'en-IN',sample:'Aaj hum is topic ko step by step, bilkul easy way mein samjhenge.'},
  {id:'Tamil',label:'தமிழ்',lang:'ta-IN',sample:'வணக்கம், இன்று இந்த தலைப்பை எளிமையாக படிப்போம்.'},
  {id:'Telugu',label:'తెలుగు',lang:'te-IN',sample:'హలో, ఈ రోజు ఈ విషయాన్ని చాలా సులభంగా నేర్చుకుందాం.'}
];
function choice(label,options,key,asNumber=false){
  const value=state[key];
  return `<div class="choice"><div class="choiceLabel">${label}</div><div class="options">${options.map(v=>`<button type="button" data-choice-key="${key}" data-choice-value="${String(v)}" class="${String(value)===String(v)?'selected':''}">${v}${asNumber?' min':''}</button>`).join('')}</div></div>`;
}
function setChoice(key,value){
  state[key]=value;
  document.querySelectorAll(`[data-choice-key="${key}"]`).forEach(btn=>{
    btn.classList.toggle('selected', String(btn.dataset.choiceValue)===String(value));

function noteDetail(point,sub){
  if(sub && String(sub).trim()) return String(sub);
  const t=state.topic.toLowerCase();
  if(/chemical|bond|atom|electron/.test(t)){
    if(/stable|stability/i.test(point)) return `${sub} In bonding, atoms tend toward arrangements that are energetically more favorable. This stability idea helps explain why different atoms form different types of bonds.`;
    if(/valence/i.test(point)) return `${sub} These outer-shell electrons are the main participants in bonding. Their number strongly influences whether an atom tends to lose, gain, or share electrons.`;
    if(/energy/i.test(point)) return `${sub} Lower-energy arrangements are generally more stable. This gives us a useful way to understand bonding instead of memorising isolated rules. It also helps explain why atoms can prefer one bonding arrangement over another.`;
    if(/octet|eight/i.test(point)) return `${sub} The octet idea is a useful model for many main-group compounds. It helps predict common bonding patterns, while remembering that important exceptions exist. So use it as a prediction tool first, then check the actual structure when needed.`;
    if(/transfer/i.test(point)) return `${sub} Electron transfer produces charged particles called ions. Their opposite charges create electrostatic attraction, which is the basis of ionic bonding.`;
    if(/opposite|attract/i.test(point)) return `${sub} Positive and negative ions attract each other through electrostatic force. In a solid, this attraction acts throughout an ordered structure. This collective arrangement is why ionic bonding is better understood as a lattice, not just one pair of ions.`;
    if(/lattice/i.test(point)) return `${sub} Ions arrange in a repeating three-dimensional lattice. The overall structure helps explain several characteristic properties of ionic solids.`;
    if(/covalent|shared/i.test(point)) return `${sub} In covalent bonding, atoms share electron pairs rather than completely transferring electrons. The shared electrons are attracted to both nuclei. That shared attraction is what helps keep the bonded atoms together.`;
    if(/lewis/i.test(point)) return `${sub} Lewis structures provide a simple way to represent valence electrons and shared pairs. They are useful for visualising common covalent bonding patterns.`;
  }
  if(/photo|plant|chlorophyll/.test(t)){
    if(/light/i.test(point)) return `${sub} Light provides the energy that drives the process. The captured energy is converted into chemical forms that the cell can use. This is why light is an energy input, not simply a raw material.`;
    if(/carbon dioxide|water/i.test(point)) return `${sub} Carbon dioxide and water provide important raw materials. Through several linked reactions, these inputs contribute to the formation of organic molecules.`;
    if(/chemical energy|organic/i.test(point)) return `${sub} The captured light energy is stored in chemical form. This stored energy supports the formation and maintenance of organic molecules in the plant.`;
    if(/ATP|NADPH/i.test(point)) return `${sub} ATP provides usable chemical energy, while NADPH provides reducing power. Both are important for the reactions that follow. Keeping their roles separate makes the next stage much easier to understand.`;
    if(/carbon dioxide enters/i.test(point)) return `${sub} Carbon dioxide supplies the carbon atoms that are incorporated into organic molecules. This is a key step in turning an inorganic carbon source into useful biological material.`;
  }
  return `${sub} This is an important part of the concept. Keep the relationship between the idea and its example in mind so you can apply it instead of only memorising the definition. The goal is to understand why it works, so you can recognise the same idea in a new question.`;
}

function pickTutorVoice(){

  // sounds naturally Indian and Indian-language classes keep their native accent.
  const exactLocale=vs.filter(v=>v.lang.toLowerCase()===target.toLowerCase());
  const indian=vs.filter(v=>v.lang.toLowerCase().startsWith(target.split('-')[0].toLowerCase()+'-in'));
  const compatible=vs.filter(v=>v.lang.toLowerCase().startsWith(target.split('-')[0].toLowerCase()));
  const preferredIndian=['google','microsoft','natural','enhanced','premium','neerja','ravi','veena','heera','aditi'];
  const chooseBest=(list)=>list.find(v=>preferredIndian.some(n=>v.name.toLowerCase().includes(n)))||list.find(v=>/natural|enhanced|premium/i.test(v.name))||list[0];

  const map=maps[state.language];

function cleanSpeechText(text){
  return String(text||'').replace(/[*_#`]/g,'').replace(/^\s*[-•]\s*/gm,'').replace(/\s+/g,' ').trim();
}
function speak(text,after){
  if(!('speechSynthesis'in window)){after?.();return}
  const token=++state.speechToken;
  state.currentSpeechText=text;
  state.currentSpeechAfter=after;
  speechSynthesis.cancel();
  const lang=({English:'en-IN',Hindi:'hi-IN',Hinglish:'en-IN',Tamil:'ta-IN',Telugu:'te-IN'})[state.language]||'en-IN';
  const make=(useVoice)=>{
    const spoken=cleanSpeechText(localizedSpeech(text));
    const u=new SpeechSynthesisUtterance(spoken);
    u.lang=lang;u.rate=Math.min(1.05,Math.max(.72,state.voiceRate||.92));u.pitch=Math.min(1.05,Math.max(.75,state.voicePitch||.90));u.volume=1;
    if(useVoice){const v=pickTutorVoice();if(v)u.voice=v}
    return u;
  };
  let retried=false, startedAt=0, watchdog=null;
  const cleanup=()=>{if(watchdog)clearInterval(watchdog);watchdog=null};
  const finish=()=>{cleanup();if(token===state.speechToken)after?.()};
  const u=make(true);
  u.onstart=()=>{if(token!==state.speechToken)return;startedAt=Date.now();const e=document.getElementById('teacherState');if(e)e.textContent='Explaining naturally…';
    // Android/Chrome speech engines can pause or stall during a longer utterance.
    watchdog=setInterval(()=>{if(token===state.speechToken&&speechSynthesis.speaking&&!speechSynthesis.paused)speechSynthesis.resume()},7000);
  };
  u.onend=finish;
  u.onerror=()=>{
    cleanup();
    if(token!==state.speechToken)return;
    if(!retried){retried=true;setTimeout(()=>{if(token!==state.speechToken)return;const f=make(false);f.onend=finish;f.onerror=finish;speechSynthesis.speak(f)},80)}
    else finish();
  };
  // No artificial pause between points: the speech engine handles natural sentence rhythm.
  setTimeout(()=>{if(token===state.speechToken)speechSynthesis.speak(u)},30);
}
function teacherFlow(point,extra,c){
  if(/pyq|important questions|exam questions/i.test(c.title||'')) return `${point}. ${extra||''}`.trim();
  if(state.depth==='Quick') return `${point}. ${extra||''}`.trim();
  return `${point}. ${extra||''}`.trim();
}
function teachPoint(){
  if(state.screen!=='class'||state.paused||state.classLoading)return;
  const c=current();
  if(state.point>=c.points.length){completeConcept();return}
  restorePoints();
  const active=document.getElementById('activePoint');active?.classList.add('visible');
  const pointData=c.points[state.point]||[];
  const point=pointData[0]||'';
  const extra=pointData[1]||'';
  const aiSpeech=pointData[2]||'';
  const stateEl=document.getElementById('teacherState');
  const speakEl=document.getElementById('speakState');
  if(stateEl)stateEl.textContent='Explaining the next idea…';
  if(speakEl)speakEl.textContent='VYRA is explaining';
  const narration=aiSpeech||teacherFlow(point,extra,c);
  speak(narration,()=>{
    if(state.screen!=='class'||state.paused)return;
    active?.classList.remove('active');active?.classList.add('complete');
    state.point++;
    if(state.point<c.points.length){setTimeout(teachPoint,650)}
    else{setTimeout(completeConcept,850)}
  });
}
function completeConcept(){const arr=deck();if(state.slide<arr.length-1){state.slide++;state.point=0;state.speechToken++;speechSynthesis?.cancel();render();const s=document.getElementById('speakState');if(s)s.textContent='Next slide…';setTimeout(teachPoint,650)}else{const s=document.getElementById('speakState');if(s)s.textContent='Lesson complete';speak('Excellent. You have completed this lesson. Take a moment to review the key ideas.')}}
function toggleDoubt(){document.getElementById('doubtPanel')?.classList.toggle('open')}
function sendText(){const i=document.getElementById('ask');const q=i.value.trim();if(q)handleDoubt(q);i.value=''}
function handleDoubt(q){
  state.paused=true;speechSynthesis?.cancel();
  const c=current(); const lower=q.toLowerCase();
  let answer=`Good question. Let’s connect it to ${c.title}. `;
  if(/why|reason/.test(lower)) answer+=`The key reason is this: ${c.say}`;
  else if(/example|real life|example/.test(lower)) answer+=`Use this mental model: ${teacherFlow(c.points[state.point]?.[0]||c.points[0][0],c.points[state.point]?.[1]||c.points[0][1],c)}`;
  else answer+=`${c.say} Now put the doubt into your own words once; that is how I can check whether the idea is clear.`;
  answer+=' Should we continue from exactly where we paused?';
  state.chat.push({r:'student',t:q},{r:'ai',t:answer});
  render();document.getElementById('doubtPanel')?.classList.add('open');
  setTimeout(()=>speak(answer),120);
}
function voice(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){toast('Voice input needs Chrome voice support');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang=({English:'en-IN',Hindi:'hi-IN',Hinglish:'en-IN',Tamil:'ta-IN',Telugu:'te-IN'})[state.language]||'en-IN';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{state.listening=true;document.getElementById('mic')?.classList.add('listening');toast('Listening… speak your doubt')};r.onresult=e=>handleDoubt(e.results[0][0].transcript);r.onerror=()=>{state.listening=false;toast('I could not hear that clearly. Try again.')};r.onend=()=>{state.listening=false};r.start()}
function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.getElementById('classroom')?.appendChild(d);setTimeout(()=>d.remove(),1800)}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{if(state.screen==='setup')render()}}document.addEventListener('fullscreenchange',()=>{});render();
</script><button id="vyraChatTab" type="button">AI Chat</button>

(()=>{
const p=document.getElementById("vyraChatPanel"),tab=document.getElementById("vyraChatTab"),close=document.getElementById("vClose"),fresh=document.getElementById("vNew"),form=document.getElementById("vForm"),inp=document.getElementById("vInput"),msgs=document.getElementById("vyraMsgs");
let history=[];
function esc(x){return String(x).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function add(role,t){let w=document.getElementById("vWelcome");if(w)w.remove();let d=document.createElement("div");d.className="vmsg "+role;d.innerHTML=role==="ai"?"<b>VYRA AI</b><br>"+t:esc(t);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function ctx(){try{const s=window.VYRA_CLASS_STATE||{};return {topic:s.topic||"",level:s.level||"",depth:s.depth||"",language:s.language||"",classActive:s.screen==='class'}}catch(e){return {}}}
function formatAIText(text){
  let x=esc(text);
  x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  return x.replace(/\n/g,'<br>');
}
function reset(){history=[];msgs.innerHTML='<div id="vWelcome" style="text-align:center;margin-top:20vh"><h1>How can I help you learn?</h1><p>Ask a question, explain a concept, solve a problem, or go deeper.</p></div>';inp.focus()}
async function answer(q){
  const c=ctx();
  const placeholder=add("ai",'<span class="vtyping">Thinking…</span>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history,context:c})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||('AI request failed ('+r.status+')'));
    const text=String(data.answer||'').trim()||'I could not generate an answer. Please try again.';
    placeholder.innerHTML='<b>VYRA AI</b><br>'+formatAIText(text);
    history.push({role:'user',content:q},{role:'assistant',content:text});
    if(history.length>30)history=history.slice(-30);
  }catch(e){placeholder.innerHTML='<b>VYRA AI</b><br><span style="color:#ffb4b4">'+esc(e.message||'Could not reach the AI server.')+'</span>'}
}
form.addEventListener("submit",async e=>{e.preventDefault();let q=inp.value.trim();if(!q)return;inp.value="";add("user",q);await answer(q);});

tab.onclick=(e)=>{e.preventDefault();e.stopPropagation();if((window.VYRA_CLASS_STATE||{}).screen==='class')return;p.style.display="flex";inp.focus()};close.onclick=()=>p.style.display="none";fresh.onclick=reset;
})();
